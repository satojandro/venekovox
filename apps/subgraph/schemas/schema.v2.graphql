# VenekoVox governance extension v2 (proposal; not an accepted Messari standard).
# Reference: messari/subgraphs@2711ac91ef119f321f65b339e10a57f9aa74f9d8,
# subgraphs/openzeppelin-governor/schema.graphql. See governance-compatibility.md.
# Native v1 entities are retained for existing readers. Native Vote is ciphertext,
# NEVER a Messari public Vote. New governance readers use Proposal.

type MACI @entity(immutable: false) {
  id: Bytes! # address
  stateTreeDepth: BigInt! # uint8
  updatedAt: BigInt!

  "state"
  totalSignups: BigInt!
  numPoll: BigInt!
  latestPoll: Bytes!

  "relations"
  polls: [Poll!]! @derivedFrom(field: "maci")
}

type User @entity(immutable: true) {
  id: ID! # publicKey
  createdAt: BigInt! # uint256
  "relations"
  accounts: [Account!]! @derivedFrom(field: "owner")
  registrations: [Registration!] @derivedFrom(field: "user")
}

type Account @entity(immutable: true) {
  id: ID! # stateIndex
  voiceCreditBalance: BigInt! # uint256
  createdAt: BigInt! # uint256
  "relations"
  owner: User!
}

type Poll @entity(immutable: false) {
  id: Bytes! # poll address
  pollId: BigInt! # uint256
  startDate: BigInt! # uint256
  endDate: BigInt! # uint256
  duration: BigInt! # uint256
  treeDepth: BigInt! # uint8
  voteOptions: BigInt! # uint256
  messageProcessor: Bytes! # address
  tally: Bytes! # address
  registrationCount: BigInt! # uint256
  createdAt: BigInt!
  updatedAt: BigInt!
  mode: BigInt! # uint8
  "merge state after ended"
  stateRoot: BigInt # uint256
  totalSignups: BigInt! # uint256
  numMessages: BigInt! # uint256
  "relations"
  owner: Bytes!
  maci: MACI!
  votes: [Vote!]! @derivedFrom(field: "poll")
  chainHashes: [ChainHash!]! @derivedFrom(field: "poll")
  registrations: [Registration!] @derivedFrom(field: "poll")
}

type Registration @entity(immutable: true) {
  id: ID! # pollId-userId
  createdAt: BigInt!
  "relations"
  user: User!
  poll: Poll!
}

type Vote @entity(immutable: true) {
  id: Bytes!
  data: [BigInt!]! # uint256[10]
  publicKey: [BigInt!]! # uint256[2] (x, y)
  hash: BigInt!
  timestamp: BigInt!
  cid: String

  "relations"
  poll: Poll!
}

type ChainHash @entity(immutable: false) {
  id: ID! # chain hash
  timestamp: BigInt!

  "relations"
  poll: Poll!
}

"Individual ballot disclosure, independent of coordinator access and tally availability."
enum BallotPrivacy {
  PUBLIC
  ENCRYPTED
}
enum CoordinatorTrust {
  NONE
  COORDINATOR_CAN_DECRYPT
  UNKNOWN
}
enum TallyStatus {
  UNAVAILABLE
  VERIFIED
}
enum GovernanceFrameworkType {
  GovernorAlpha
  GovernorBravo
  OZGovernor
  AaveGovernanceV2
  MACI
}

"Messari-derived common governance identity. Token-specific fields are deliberately absent."
type GovernanceFramework @entity(immutable: false) {
  id: String!
  name: String!
  type: GovernanceFrameworkType!
  contractAddress: String!
  network: String!
  schemaVersion: String!
  proposals: [Proposal!]! @derivedFrom(field: "governanceFramework")
}

"A private poll projected into a governance proposal. Null results mean unavailable, not zero."
type Proposal @entity(immutable: false) {
  id: ID!
  governanceFramework: GovernanceFramework!
  poll: Poll!
  txnHash: String!
  creationBlock: BigInt!
  creationTime: BigInt!
  creationLogIndex: BigInt!
  "Not present in MACI DeployPoll; requires separately authenticated metadata."
  description: String
  "Governor block-clock fields are not populated from MACI Unix timestamps."
  startBlock: BigInt
  endBlock: BigInt
  startTime: BigInt!
  endTime: BigInt!
  ballotPrivacy: BallotPrivacy!
  coordinatorTrust: CoordinatorTrust!
  tallyStatus: TallyStatus!
  "Public keys registered in this poll; not unique people or counted ballots."
  registrationCount: BigInt!
  "PublishMessage events, excluding the constructor placeholder; includes replacement/invalid commands."
  publishedMessageCount: BigInt!
  "IPFS batch announcements, not a count of authenticated messages inside them."
  offchainBatchCount: BigInt!
  voteOptionCapacity: BigInt!
  votingMode: BigInt!
  tallyAddress: Bytes!
  "All result fields stay null until a supported verified-result ingestion path exists."
  forWeightedVotes: BigInt
  againstWeightedVotes: BigInt
  abstainWeightedVotes: BigInt
  totalWeightedVotes: BigInt
  countedBallots: BigInt
  resultCommitment: Bytes
  resultTransaction: Bytes
  updatedAt: BigInt!
}
